<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>Selfreadme</title>
  <!-- A 3 × 3 contribution grid in the site's plum-to-pink shades; the brightest square sits bottom-right, like "Build my README". -->
  <rect width="32" height="32" rx="7" fill="#0d060b"/>
  <rect x="3.5" y="3.5" width="7" height="7" rx="1.5" fill="#7d1653"/>
  <rect x="12.5" y="3.5" width="7" height="7" rx="1.5" fill="#c02a6e"/>
  <rect x="21.5" y="3.5" width="7" height="7" rx="1.5" fill="#470c35"/>
  <rect x="3.5" y="12.5" width="7" height="7" rx="1.5" fill="#470c35"/>
  <rect x="12.5" y="12.5" width="7" height="7" rx="1.5" fill="#7d1653"/>
  <rect x="21.5" y="12.5" width="7" height="7" rx="1.5" fill="#c02a6e"/>
  <rect x="3.5" y="21.5" width="7" height="7" rx="1.5" fill="#c02a6e"/>
  <rect x="12.5" y="21.5" width="7" height="7" rx="1.5" fill="#470c35"/>
  <rect x="21.5" y="21.5" width="7" height="7" rx="1.5" fill="#ff488b"/>
</svg>
